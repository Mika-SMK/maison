version: '3.8'

# Configuration Docker Compose pour Omada Controller et NtopNG
# Documentation complète: /workspace/ISSUE_OMADA_NTOPNG_ACCESS.md

services:
  # Service NtopNG - Monitoring et analyse du trafic réseau
  ntopng:
    image: vimagick/ntopng:latest
    container_name: ntopng
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - INTERFACE=eth0
    ports:
      - "3000:3000"
    volumes:
      - ntopng-data:/var/lib/ntopng
      - /var/log/ntopng:/var/log/ntopng
    command: >
      --interface eth0
      --http-port 3000
      --dns-mode 1
      --local-networks "172.0.0.0/8,192.168.0.0/16,10.0.0.0/8"
    labels:
      - "description=NtopNG Network Traffic Analyzer"
      - "documentation=https://www.ntop.org/guides/ntopng/"

  # Service Omada Controller - Gestion réseau TP-Link
  omada-controller:
    image: mbentley/omada-controller:latest
    container_name: omada-controller
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris
      - MANAGE_HTTP_PORT=8088
      - MANAGE_HTTPS_PORT=8043
      - PORTAL_HTTP_PORT=8088
      - PORTAL_HTTPS_PORT=8843
      - PORT_APP_DISCOVERY=27001
      - PORT_ADOPT_V1=29812
      - PORT_UPGRADE_V1=29813
      - PORT_MANAGER_V1=29811
      - PORT_MANAGER_V2=29814
      - SHOW_SERVER_LOGS=true
      - SHOW_MONGODB_LOGS=false
      - SSL_CERT_NAME=tls.crt
      - SSL_KEY_NAME=tls.key
    ports:
      # Interface Web de gestion
      - "8088:8088"   # HTTP
      - "8043:8043"   # HTTPS
      # Portail captif
      - "8843:8843"   # Portal HTTPS
      # Communication avec les appareils
      - "27001:27001/udp"  # Discovery
      - "29810:29810/udp"  # Manager Discovery
      - "29811:29811"      # Manager V1
      - "29812:29812"      # Adopt V1
      - "29813:29813"      # Upgrade V1
      - "29814:29814"      # Manager V2
    volumes:
      - omada-data:/opt/tplink/EAPController/data
      - omada-logs:/opt/tplink/EAPController/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "description=TP-Link Omada Software Controller"
      - "documentation=https://www.tp-link.com/en/support/download/omada-software-controller/"

volumes:
  # Volumes persistants pour conserver les données
  ntopng-data:
    driver: local
    labels:
      - "description=NtopNG data directory"
  
  omada-data:
    driver: local
    labels:
      - "description=Omada Controller configuration and database"
  
  omada-logs:
    driver: local
    labels:
      - "description=Omada Controller logs"

# Configuration réseau par défaut
networks:
  default:
    name: monitoring-network
    driver: bridge
